name: cloud-browser

# AgentX cloud browser PoC (EXPERIMENTAL).
# Runs headless Chromium on the GitHub-hosted runner and bridges it to a
# Cloudflare Durable Object (singleton "browser-main") over ONE outbound
# WebSocket. Clients always use ONE stable Worker URL; the DO relays CDP
# HTTP + WebSocket between clients and whichever runner is currently up.
#
# No third-party tunnel service is used at all. Dropped over time:
# cloudflared quick tunnels (edge 403-blocks datacenter IPs, including
# Cloudflare Workers themselves), localhost.run (never prints the assigned
# URL without an interactive terminal), pinggy (free tier needs a token /
# 60-min cap), ngrok (signup demands a payment method), bore (bore.pub
# printed a URL but forwarded no data), tunnelmole (URL worked but the
# tunnel returned empty HTTP 500s for tunneled traffic).
#
# Restarts are SELF-CHAINED: each run dispatches its own successor via the
# GitHub API at ~5h50m, just before the 6h job kill. The successor simply
# opens a new uplink WebSocket and the DO swaps it in. NOTE: the swap closes
# active client CDP sockets (1001) — clients must reconnect and will land on
# the new Chromium instance, so keep the overlap SHORT to limit flapping.
# dispatch_next() also dedupes: it never dispatches while a NEWER run is
# already in progress, so one accidental double-dispatch cannot grow back
# into a multi-runner swarm. No reliance on GitHub's scheduled cron.

on:
  workflow_dispatch:

jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 355 # hard kill stays under GitHub's 6h job limit
    permissions:
      contents: write # heartbeat commit
      actions: write  # self-dispatch of the successor run
    # NOTE: no `concurrency` group on purpose — overlapping runs are required.

    steps:
      - uses: actions/checkout@v4

      - name: Heartbeat (keeps the repo active)
        run: |
          git config user.name "agentx-bot"
          git config user.email "agentx-bot@users.noreply.github.com"
          date -u +%FT%TZ > .heartbeat
          git add .heartbeat
          git commit -m "heartbeat $(date -u +%FT%TZ)" >/dev/null 2>&1 || true
          git push >/dev/null 2>&1 || true

      - name: Start Chromium (headless, CDP on 127.0.0.1:9222)
        run: |
          CHROME=$(which google-chrome || which chromium-browser || which chromium)
          echo "Using: $CHROME"
          "$CHROME" --headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage \
            --remote-debugging-address=127.0.0.1 --remote-debugging-port=9222 \
            --user-data-dir=/tmp/chrome-profile about:blank >/tmp/chrome.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:9222/json/version >/dev/null; then
              echo "CDP is up"
              break
            fi
            sleep 2
          done
          curl -sf http://127.0.0.1:9222/json/version | head -c 300; echo

      - name: Connect relay to Cloudflare Durable Object
        # runner/relay.py bridges local CDP to the DO over one outbound WSS.
        # No tunnel, no port forwarding, no third-party service. The relay
        # auto-reconnects; the DO treats the newest uplink as current.
        run: |
          pip install --quiet websockets
          python3 runner/relay.py >/tmp/relay.log 2>&1 &
          for i in $(seq 1 30); do
            if grep -q "connected to DO" /tmp/relay.log 2>/dev/null; then
              echo "relay uplink established"
              break
            fi
            if ! pgrep -f "runner/relay.py" >/dev/null; then
              echo "relay died. Log:"; cat /tmp/relay.log; exit 1
            fi
            sleep 4
          done
          grep -q "connected to DO" /tmp/relay.log || { echo "relay never connected"; cat /tmp/relay.log; exit 1; }
          # The DO should now report a live browser on the public /health.
          for i in $(seq 1 12); do
            if curl -sf -m 10 "$WORKER_URL/health" | grep -q '"ok":true'; then
              echo "Worker reports browser online"; break
            fi
            [ "$i" -eq 12 ] && { echo "Worker health never went ok"; exit 1; }
            sleep 5
          done
        env:
          WORKER_URL: ${{ secrets.WORKER_URL }}
          RELAY_SECRET: ${{ secrets.RELAY_SECRET }}

      - name: Chain successor run and hold until timeout
        run: |
          dispatch_next() {
            # DEDUPE: if a NEWER cloud-browser run is already in progress, the
            # fleet already has a successor — dispatching again multiplies
            # lineages (each run chains its own, swarm regrows).
            local newer
            newer=$(curl -sf \
              -H "Authorization: Bearer $GITHUB_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${{ github.repository }}/actions/runs?status=in_progress&per_page=20" | \
              jq -r --argjson me "$GITHUB_RUN_ID" \
                '[.workflow_runs[] | select(.name == "cloud-browser" and .id > $me)] | length')
            if [ "${newer:-0}" -gt 0 ]; then
              echo "newer cloud-browser run already in progress; skipping dispatch (dedupe)"
              return 0
            fi
            if curl -sf -X POST \
              -H "Authorization: Bearer $GITHUB_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${{ github.repository }}/actions/workflows/browser.yml/dispatches" \
              -d '{"ref":"${{ github.ref_name }}"}'; then
              echo "successor dispatched"
            else
              echo "successor dispatch FAILED"
            fi
          }
          # Dispatch the next run at ~5h50m, just before this job is killed at
          # ~5h55m. Overlap is ~5 min instead of ~65 min: every minute of
          # overlap is a window where the DO keeps swapping the uplink and
          # client CDP sockets get 1001-closed. (Was 4h50m / 17400s.)
          # NOTE: dispatches always run the workflow file as it exists on the
          # branch AT DISPATCH TIME, so successors self-heal to the newest code.
          ( sleep 21000; dispatch_next ) &
          for i in $(seq 1 70); do
            sleep 300
            # If the relay died AND Chromium is gone, the chain is broken:
            # dispatch a successor immediately instead of waiting.
            if ! pgrep -f "runner/relay.py" >/dev/null && \
               ! curl -sf -m 10 http://127.0.0.1:9222/json/version >/dev/null; then
              echo "Relay and Chromium both down, dispatching successor now"
              dispatch_next
              exit 0
            fi
          done
          echo "Hold complete, job will now exit before the 6h limit"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
